[project]
name = "sandbox"
version = "0.1.0"
requires-python = ">=3.13,<4"
dependencies = [
    "requests>=2.34.2,<3",
    "pydantic>=2.14,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "basedpyright>=1.40.2",
    "ruff>=0.17.3,<1"
]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "basic"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"


